services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: elonga_db
      POSTGRES_USER: elonga_user
      POSTGRES_PASSWORD: elonga_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: gunicorn elonga.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  postgres_data: